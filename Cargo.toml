[package]
name = "codex_info"
version = "1.0.17"
edition = "2021"
default-run = "codex_info"
license = "GPL-3.0-only"
publish = false

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
iana-time-zone = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.3.4"
# HTTPの解析・接続処理は実績のある実装へ委譲する。APIはloopback限定の
# 読み取り専用スナップショットであり、UIやCodex RPCをHTTP workerから触らない。
axum = "0.8.4"
tokio = { version = "1", features = ["net", "rt", "signal", "sync", "time"] }
# X11を明示し、WSLgでWayland/EGL経路を選ばない。ソフトウェア描画はrun.shの
# llvmpipe設定とも整合し、GPUドライバがなくても起動できる。
slint = { version = "1.17.1", default-features = false, features = ["std", "compat-1-2", "backend-winit-x11", "renderer-software", "raw-window-handle-06", "unstable-winit-030"] }
# Slintのビルド時依存と実行時依存でfontconfigの読み込み方式を揃える。
fontique = { version = "0.10.0", default-features = false, features = ["fontconfig-dlopen"] }
rusqlite = { version = "0.32", features = ["bundled", "limits", "backup"] }
raw-window-handle = "0.6"
x11rb = "0.13"
url = "2"
# Linux process-instance signalling for the profile-owned --stop contract.
# The safe pidfd wrappers avoid a PID-only TOCTOU without adding unsafe code to
# this crate.
rustix = { version = "0.38.44", default-features = false, features = ["std", "process"] }

[build-dependencies]
slint-build = "1.17.1"

[[test]]
name = "usage_store"
path = "src/usage_store.rs"

[[test]]
name = "security"
path = "src/security.rs"
