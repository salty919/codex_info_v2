[package]
name = "codex-info-recorder"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false

[[bin]]
name = "codex_info_recorder"
path = "src/main.rs"

[dependencies]
codex_info = { path = "../.." }
codex-info-account-locator = { path = "../codex-info-account-locator" }
codex-info-db-writer = { path = "../codex-info-db-writer" }
chrono = { version = "0.4", features = ["serde"] }
getrandom = "0.3.4"
serde_json = "1"
sha2 = "0.10"
rustix = { version = "0.38.44", default-features = false, features = ["std", "fs"] }

[dev-dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
