name: Dependency review

on:
  pull_request:
    branches: [feat/next]
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
      base_sha:
        required: true
        type: string

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # API-only: no checkout or execution of PR source, and no PR comments.
      # Rust licenses remain owned by deny.toml; NuGet allow rules are unspecified.
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          base-ref: ${{ inputs.base_sha || github.event.pull_request.base.sha }}
          head-ref: ${{ inputs.source_sha || github.event.pull_request.head.sha }}
          fail-on-severity: low
          fail-on-scopes: runtime,development,unknown
          license-check: 'false'
          vulnerability-check: 'true'
          comment-summary-in-pr: never
          retry-on-snapshot-warnings: 'false'
          show-openssf-scorecard: 'false'
          warn-only: 'false'
