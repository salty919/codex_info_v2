name: Native quality (reusable)

on:
  workflow_call:
    inputs:
      source_sha:
        description: Immutable source commit selected by the trusted caller
        required: true
        type: string
      release_candidate:
        description: Whether this is the final main release-candidate path
        required: true
        type: boolean

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  native-quality:
    name: native-quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Install required native quality tools
        if: inputs.release_candidate
        run: sudo apt-get update && sudo apt-get install --no-install-recommends --yes ripgrep sqlite3 xvfb xauth x11-utils x11-apps libxkbcommon-x11-0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: llvm-tools-preview
      - name: Install locked Rust coverage tool
        uses: taiki-e/install-action@fa23953489c080190314742a9b907f8e97c6767c # v2.87.10
        with:
          tool: cargo-llvm-cov@0.9.0
          fallback: none
      - name: Check native formatting
        if: ${{ !inputs.release_candidate }}
        run: cargo fmt --check
      - name: Run native unit tests with coverage
        run: |
          mkdir -p artifacts/codacy-coverage-rust
          cargo llvm-cov --workspace --locked --all-targets --cobertura \
            --output-path artifacts/codacy-coverage-rust/rust.cobertura.xml \
            -- --nocapture
          report=artifacts/codacy-coverage-rust/rust.cobertura.xml
          test -s "$report"
          grep -Eq 'lines-valid="[1-9][0-9]*"' "$report"
          if grep -Eq 'filename="(/|[A-Za-z]:[\\/])' "$report"; then
            echo 'Rust Cobertura contains a runner-specific path.' >&2
            exit 1
          fi
      - name: Preserve native coverage for isolated upload
        uses: actions/upload-artifact@v4
        with:
          name: codacy-coverage-rust-v1-head-${{ inputs.source_sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: artifacts/codacy-coverage-rust/rust.cobertura.xml
          if-no-files-found: error
      - name: Reject native compiler and Clippy warnings
        run: cargo clippy --workspace --locked --all-targets -- -D warnings
      - name: Build native release
        if: inputs.release_candidate
        run: cargo build --workspace --release --locked
      - name: Verify recorder and REST compile-time boundary
        run: bash scripts/check_recorder_rest_boundary.sh --static-only
      - name: Run public CLI lifecycle acceptance
        if: inputs.release_candidate
        run: bash scripts/cli_contract_e2e.sh
      - name: Run recorder daemon live acceptance
        if: inputs.release_candidate
        run: xvfb-run --auto-servernum --server-args='-screen 0 1280x800x24' bash scripts/record_daemon_e2e.sh
