name: Native quality (reusable)

on:
  workflow_call:
    inputs:
      source_sha:
        description: Immutable source commit selected by the trusted caller
        required: true
        type: string

permissions:
  contents: read

jobs:
  native-quality:
    name: native-quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Check native formatting
        run: bash scripts/regression_guard.sh --format
      - name: Run native unit tests
        run: bash scripts/regression_guard.sh --test
