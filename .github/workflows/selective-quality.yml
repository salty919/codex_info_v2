name: Selective quality (reusable)

on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
      base_sha:
        required: true
        type: string
      head_ref:
        required: true
        type: string
      selection_json:
        required: true
        type: string
      release_candidate:
        required: true
        type: boolean

permissions:
  contents: read

jobs:
  docs-quality:
    name: docs-quality
    if: contains(fromJSON(inputs.selection_json).owners, 'DOCS')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Validate documentation revision
        run: bash scripts/requirements_ledger_gate.sh

  governance-quality:
    name: governance-quality
    if: contains(fromJSON(inputs.selection_json).owners, 'GOVERNANCE')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false
      - name: Validate workflow contracts
        env:
          BASE_SHA: ${{ inputs.base_sha }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          mapfile -t changed_workflows < <(
            git diff --diff-filter=ACMRT --name-only "$BASE_SHA...$SOURCE_SHA" -- \
              '.github/workflows/*.yml' '.github/workflows/*.yaml' |
              while IFS= read -r path; do
                [[ -f "$path" ]] && printf '%s\n' "$path"
              done
          )
          if ((${#changed_workflows[@]} > 0)); then
            # actionlint 1.7.12 still models the pre-v3 input names for this action.
            go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 \
              -ignore 'missing input "app-id" which is required by action "actions/create-github-app-token@v3"' \
              -ignore 'input "client-id" is not defined in action "actions/create-github-app-token@v3"' \
              "${changed_workflows[@]}"
          fi
          bash scripts/pre_pr_gate.sh --base "$BASE_SHA" \
            --requested-check governance-contract

  linux-backend-quality:
    name: linux-backend-quality
    if: contains(fromJSON(inputs.selection_json).owners, 'LINUX_BACKEND') && !(inputs.release_candidate && fromJSON(inputs.selection_json).binary_impact)
    uses: ./.github/workflows/rust.yml
    with:
      source_sha: ${{ inputs.source_sha }}

  linux-ui-quality:
    name: linux-ui-quality
    if: contains(fromJSON(inputs.selection_json).owners, 'LINUX_UI') && !(inputs.release_candidate && fromJSON(inputs.selection_json).binary_impact)
    uses: ./.github/workflows/linux-ui-quality.yml
    with:
      source_sha: ${{ inputs.source_sha }}

  windows-quality:
    name: windows-quality
    if: contains(fromJSON(inputs.selection_json).owners, 'WINDOWS')
    uses: ./.github/workflows/windows-client.yml
    with:
      source_sha: ${{ inputs.source_sha }}
      release_candidate: ${{ inputs.release_candidate && fromJSON(inputs.selection_json).binary_impact }}
      powershell_paths_json: ${{ toJSON(fromJSON(inputs.selection_json).powershell_paths) }}

  codeql-quality:
    name: codeql-quality
    if: toJSON(fromJSON(inputs.selection_json).codeql_languages) != '[]'
    uses: ./.github/workflows/codeql.yml
    with:
      source_sha: ${{ inputs.source_sha }}
      head_ref: ${{ inputs.head_ref }}
      languages_json: ${{ toJSON(fromJSON(inputs.selection_json).codeql_languages) }}
    permissions:
      contents: read
      security-events: write

  linux-release-quality:
    name: linux-release-quality
    if: fromJSON(inputs.selection_json).distribution_required == true
    uses: ./.github/workflows/linux-release-quality.yml
    with:
      source_sha: ${{ inputs.source_sha }}
