name: Selective quality (reusable)

on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
      base_sha:
        required: true
        type: string
      head_ref:
        required: true
        type: string
      pr_number:
        required: true
        type: string
      selection_json:
        required: true
        type: string
      release_candidate:
        required: true
        type: boolean

permissions:
  contents: read

jobs:
  docs-quality:
    name: docs-quality
    if: contains(fromJSON(inputs.selection_json).owners, 'DOCS')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Validate documentation revision
        env:
          BASE_SHA: ${{ inputs.base_sha }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          git diff --check "$BASE_SHA" "$SOURCE_SHA"
          bash scripts/requirements_ledger_gate.sh

  governance-quality:
    name: governance-quality
    if: contains(fromJSON(inputs.selection_json).owners, 'GOVERNANCE')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
          cache: false
      - name: Validate workflow syntax and requirements
        env:
          BASE_SHA: ${{ inputs.base_sha }}
          QUALITY_PROFILE: ${{ fromJSON(inputs.selection_json).quality_profile }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          git diff --check "$BASE_SHA" "$SOURCE_SHA"
          bash scripts/requirements_ledger_gate.sh
          if [[ "$QUALITY_PROFILE" == workflow-selection ]]; then
            mapfile -t changed_workflows < <(
              git diff --name-only "$BASE_SHA" "$SOURCE_SHA" -- '.github/workflows/*.yml'
            )
            if ((${#changed_workflows[@]} > 0)); then
              go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 "${changed_workflows[@]}"
            fi
            python3 scripts/test_requirements_authority.py
            python3 scripts/test_quality_plan.py
            python3 scripts/test_ci_change_scope.py
            python3 scripts/test_selected_quality_gate.py
            python3 scripts/test_codeql_workflow.py
            python3 scripts/workflow_quality_gate.py --self-test --profile workflow-selection
          elif [[ "$QUALITY_PROFILE" == release ]]; then
            go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 .github/workflows/*.yml
            python3 scripts/workflow_inno_acquisition_gate.py --self-test
            python3 scripts/workflow_quality_gate.py --self-test
          else
            echo "unsupported governance quality profile: $QUALITY_PROFILE" >&2
            exit 1
          fi

  linux-backend-quality:
    name: linux-backend-quality
    if: contains(fromJSON(inputs.selection_json).owners, 'LINUX_BACKEND')
    uses: ./.github/workflows/rust.yml
    with:
      source_sha: ${{ inputs.source_sha }}
      quality_profile: ${{ fromJSON(inputs.selection_json).quality_profile }}
    permissions:
      contents: read

  linux-ui-quality:
    name: linux-ui-quality
    if: contains(fromJSON(inputs.selection_json).owners, 'LINUX_UI')
    uses: ./.github/workflows/linux-ui-quality.yml
    with:
      source_sha: ${{ inputs.source_sha }}
      quality_profile: ${{ fromJSON(inputs.selection_json).quality_profile }}
    permissions:
      contents: read

  windows-quality:
    name: windows-quality
    if: contains(fromJSON(inputs.selection_json).owners, 'WINDOWS')
    uses: ./.github/workflows/windows-client.yml
    with:
      source_sha: ${{ inputs.source_sha }}
      pr_number: ${{ inputs.pr_number }}
      release_candidate: ${{ inputs.release_candidate }}
      quality_profile: ${{ fromJSON(inputs.selection_json).quality_profile }}
    permissions:
      contents: read

  codeql-quality:
    name: codeql-quality
    if: toJSON(fromJSON(inputs.selection_json).codeql_languages) != '[]'
    uses: ./.github/workflows/codeql.yml
    with:
      source_sha: ${{ inputs.source_sha }}
      head_ref: ${{ inputs.head_ref }}
      languages_json: ${{ toJSON(fromJSON(inputs.selection_json).codeql_languages) }}
    permissions:
      contents: read
      security-events: write

  linux-distribution:
    name: linux-distribution
    if: fromJSON(inputs.selection_json).distribution_required == true
    uses: ./.github/workflows/linux-distribution.yml
    with:
      source_sha: ${{ inputs.source_sha }}
      pr_number: ${{ inputs.pr_number }}
      release_candidate: ${{ inputs.release_candidate }}
    permissions:
      contents: read

  selected-quality:
    name: selected-quality
    if: always() && inputs.release_candidate
    needs:
      - docs-quality
      - governance-quality
      - linux-backend-quality
      - linux-ui-quality
      - windows-quality
      - codeql-quality
      - linux-distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Require selected success and non-selected skip
        env:
          SELECTION: ${{ inputs.selection_json }}
          RELEASE_CANDIDATE: ${{ inputs.release_candidate }}
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          results="$(jq -c 'with_entries(.value = .value.result)' <<<"$RESULTS")"
          python3 scripts/selected_quality_gate.py \
            --selection "$SELECTION" \
            --results "$results" \
            --release-candidate "$RELEASE_CANDIDATE"
