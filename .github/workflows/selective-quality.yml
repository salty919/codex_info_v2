name: Selective quality (reusable)

on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
      base_sha:
        required: true
        type: string
      head_ref:
        required: true
        type: string
      pr_number:
        required: true
        type: string
      selection_json:
        required: true
        type: string
      release_candidate:
        required: true
        type: boolean

permissions:
  contents: read

jobs:
  docs-quality:
    name: docs-quality
    if: contains(fromJSON(inputs.selection_json).owners, 'DOCS')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Validate documentation revision
        env:
          BASE_SHA: ${{ inputs.base_sha }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          git diff --check "$BASE_SHA" "$SOURCE_SHA"
          bash scripts/requirements_ledger_gate.sh

  governance-quality:
    name: governance-quality
    if: contains(fromJSON(inputs.selection_json).owners, 'GOVERNANCE')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false
      - name: Validate workflow syntax and requirements
        env:
          BASE_SHA: ${{ inputs.base_sha }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          git diff --check "$BASE_SHA" "$SOURCE_SHA"
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 .github/workflows/*.yml
          bash scripts/requirements_ledger_gate.sh

  linux-backend-quality:
    name: linux-backend-quality
    if: contains(fromJSON(inputs.selection_json).owners, 'LINUX_BACKEND')
    uses: ./.github/workflows/rust.yml
    with:
      source_sha: ${{ inputs.source_sha }}
    permissions:
      contents: read

  linux-ui-quality:
    name: linux-ui-quality
    if: contains(fromJSON(inputs.selection_json).owners, 'LINUX_UI')
    uses: ./.github/workflows/linux-ui-quality.yml
    with:
      source_sha: ${{ inputs.source_sha }}
    permissions:
      contents: read

  windows-quality:
    name: windows-quality
    if: contains(fromJSON(inputs.selection_json).owners, 'WINDOWS')
    uses: ./.github/workflows/windows-client.yml
    with:
      source_sha: ${{ inputs.source_sha }}
      pr_number: ${{ inputs.pr_number }}
      release_candidate: ${{ inputs.release_candidate }}
    permissions:
      contents: read

  codeql-quality:
    name: codeql-quality
    if: toJSON(fromJSON(inputs.selection_json).codeql_languages) != '[]'
    uses: ./.github/workflows/codeql.yml
    with:
      source_sha: ${{ inputs.source_sha }}
      head_ref: ${{ inputs.head_ref }}
      languages_json: ${{ toJSON(fromJSON(inputs.selection_json).codeql_languages) }}
    permissions:
      contents: read
      security-events: write

  selected-quality:
    name: selected-quality
    if: always()
    needs:
      - docs-quality
      - governance-quality
      - linux-backend-quality
      - linux-ui-quality
      - windows-quality
      - codeql-quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.base_sha }}
          persist-credentials: false
      - name: Require selected success and non-selected skip
        env:
          SELECTION: ${{ inputs.selection_json }}
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          results="$(jq -c 'with_entries(.value = .value.result)' <<<"$RESULTS")"
          python3 scripts/selected_quality_gate.py --selection "$SELECTION" --results "$results"
