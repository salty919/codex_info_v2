name: Selective quality (reusable)

on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
      base_sha:
        required: true
        type: string
      head_ref:
        required: true
        type: string
      pr_number:
        required: true
        type: string
      selection_json:
        required: true
        type: string
      native_reuse_artifact:
        description: Optional current-run bridge verified by the existing main authority
        type: string
        default: ''
      release_preflight:
        description: Run release behavior checks without publication authority
        type: boolean
        default: false
      preflight_plan:
        description: Trusted read-only prospective release tree, empty for an actual source
        type: string
        default: ''
      release_candidate:
        required: true
        type: boolean

permissions:
  contents: read

jobs:
  docs-quality:
    name: docs-quality
    if: contains(fromJSON(inputs.selection_json).owners, 'DOCS')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Validate documentation revision
        env:
          BASE_SHA: ${{ inputs.base_sha }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          git diff --check "$BASE_SHA" "$SOURCE_SHA"
          bash scripts/requirements_ledger_gate.sh

  governance-quality:
    name: governance-quality
    if: contains(fromJSON(inputs.selection_json).owners, 'GOVERNANCE')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
          cache: false
      - name: Install isolated CI parser dependency
        run: |
          set -euo pipefail
          python3 -m venv --system-site-packages "$RUNNER_TEMP/native-proof-venv"
          printf '%s\n' 'defusedxml==0.7.1 --hash=sha256:a352e7e428770286cc899e2542b6cdaedb2b4953ff269a210103ec58f6198a61' > "$RUNNER_TEMP/native-proof-requirements.txt"
          "$RUNNER_TEMP/native-proof-venv/bin/python" -I -m pip install \
            --disable-pip-version-check --only-binary=:all: --no-deps --require-hashes \
            -r "$RUNNER_TEMP/native-proof-requirements.txt"
      - name: Validate workflow contracts
        env:
          BASE_SHA: ${{ inputs.base_sha }}
          RELEASE_CANDIDATE: ${{ inputs.release_candidate }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          export PATH="$RUNNER_TEMP/native-proof-venv/bin:$PATH"
          if [[ "$RELEASE_CANDIDATE" == false ]]; then
            mapfile -t changed_workflows < <(
              git diff --name-only "$BASE_SHA" "$SOURCE_SHA" -- '.github/workflows/*.yml'
            )
            if ((${#changed_workflows[@]} > 0)); then
              go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 "${changed_workflows[@]}"
            fi
            bash scripts/pre_pr_gate.sh --base "$BASE_SHA" \
              --requested-check governance-contract
          else
            authority_changed="$(
              python3 - <<'PY'
          import os
          import subprocess

          from scripts.ci_change_scope import paths_from_name_status

          changed = paths_from_name_status(
              subprocess.check_output(
                  [
                      "git", "diff", "--name-status", "-z", "-M", "-C",
                      "--find-copies-harder", os.environ["BASE_SHA"], os.environ["SOURCE_SHA"],
                  ]
              )
          )
          authority_paths = {
              "scripts/requirements_authority.py",
              "scripts/test_requirements_authority.py",
              "scripts/requirements_ledger_gate.sh",
          }
          print("true" if authority_paths.intersection(changed) else "false")
          PY
            )"
            if [[ "$authority_changed" == true ]]; then
              python3 scripts/test_requirements_authority.py
            fi
            go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 .github/workflows/*.yml
            python3 scripts/workflow_inno_acquisition_gate.py --self-test
            python3 scripts/workflow_quality_gate.py --self-test
          fi

  linux-backend-quality:
    name: linux-backend-quality
    if: contains(fromJSON(inputs.selection_json).owners, 'LINUX_BACKEND')
    uses: ./.github/workflows/rust.yml
    with:
      source_sha: ${{ inputs.source_sha }}
      base_sha: ${{ inputs.base_sha }}
      pr_number: ${{ inputs.pr_number }}
      native_reuse_artifact: ${{ inputs.native_reuse_artifact }}
      release_preflight: ${{ inputs.release_preflight && fromJSON(inputs.selection_json).binary_impact }}
      preflight_plan: ${{ inputs.preflight_plan }}
      release_candidate: ${{ inputs.release_candidate && fromJSON(inputs.selection_json).binary_impact }}
    permissions:
      contents: read

  linux-ui-quality:
    name: linux-ui-quality
    if: contains(fromJSON(inputs.selection_json).owners, 'LINUX_UI')
    uses: ./.github/workflows/linux-ui-quality.yml
    with:
      source_sha: ${{ inputs.source_sha }}
      release_preflight: ${{ inputs.release_preflight && fromJSON(inputs.selection_json).binary_impact }}
      preflight_plan: ${{ inputs.preflight_plan }}
      release_candidate: ${{ inputs.release_candidate && fromJSON(inputs.selection_json).binary_impact }}
    permissions:
      contents: read

  windows-quality:
    name: windows-quality
    if: contains(fromJSON(inputs.selection_json).owners, 'WINDOWS')
    uses: ./.github/workflows/windows-client.yml
    with:
      source_sha: ${{ inputs.source_sha }}
      pr_number: ${{ inputs.pr_number }}
      release_preflight: ${{ inputs.release_preflight && fromJSON(inputs.selection_json).binary_impact }}
      preflight_plan: ${{ inputs.preflight_plan }}
      release_candidate: ${{ inputs.release_candidate && fromJSON(inputs.selection_json).binary_impact }}
    permissions:
      contents: read

  codeql-quality:
    name: codeql-quality
    if: toJSON(fromJSON(inputs.selection_json).codeql_languages) != '[]'
    uses: ./.github/workflows/codeql.yml
    with:
      source_sha: ${{ inputs.source_sha }}
      head_ref: ${{ inputs.head_ref }}
      languages_json: ${{ toJSON(fromJSON(inputs.selection_json).codeql_languages) }}
    permissions:
      contents: read
      security-events: write

  linux-distribution:
    name: linux-distribution
    if: fromJSON(inputs.selection_json).distribution_required == true
    uses: ./.github/workflows/linux-distribution.yml
    with:
      source_sha: ${{ inputs.source_sha }}
      pr_number: ${{ inputs.pr_number }}
      release_preflight: ${{ inputs.release_preflight }}
      preflight_plan: ${{ inputs.preflight_plan }}
      release_candidate: ${{ inputs.release_candidate }}
    permissions:
      contents: read

  selected-quality:
    name: selected-quality
    if: always() && inputs.release_candidate
    needs:
      - docs-quality
      - governance-quality
      - linux-backend-quality
      - linux-ui-quality
      - windows-quality
      - codeql-quality
      - linux-distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Require selected success and non-selected skip
        env:
          SELECTION: ${{ inputs.selection_json }}
          RELEASE_CANDIDATE: ${{ inputs.release_candidate }}
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          results="$(jq -c 'with_entries(.value = .value.result)' <<<"$RESULTS")"
          python3 scripts/selected_quality_gate.py \
            --selection "$SELECTION" \
            --results "$results" \
            --release-candidate "$RELEASE_CANDIDATE"
