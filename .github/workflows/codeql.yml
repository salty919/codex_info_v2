name: CodeQL analysis

on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
      head_ref:
        required: true
        type: string
      languages_json:
        required: true
        type: string

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    if: github.event.pull_request.head.repo.full_name == github.repository
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(inputs.languages_json) }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:${{ matrix.language }}"
          ref: refs/heads/${{ inputs.head_ref }}
          sha: ${{ inputs.source_sha }}
