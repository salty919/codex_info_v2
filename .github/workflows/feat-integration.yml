name: Feat integration

on:
  pull_request_target:
    branches: ["feat/next"]
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

concurrency:
  group: feat-integration-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  classify:
    name: Classify complete PR diff
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      selection_json: ${{ steps.classify.outputs.selection_json }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Classify the event's exact base and head
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ "$HEAD_REPOSITORY" == "$REPOSITORY" ]] || {
            echo 'selective integration currently supports same-repository PRs' >&2
            exit 1
          }
          git fetch --no-tags origin "$HEAD_SHA"
          changes="$RUNNER_TEMP/changed-paths.z"
          git diff --find-renames=50% --find-copies=50% --find-copies-harder \
            --name-status -z "$BASE_SHA...$HEAD_SHA" > "$changes"
          selection="$(python3 scripts/ci_change_scope.py --name-status "$changes")"
          printf 'selection_json=%s\n' "$selection" >> "$GITHUB_OUTPUT"

  selective-quality:
    name: Run selected quality owners
    needs: [classify]
    uses: ./.github/workflows/selective-quality.yml
    with:
      source_sha: ${{ github.event.pull_request.head.sha }}
      base_sha: ${{ github.event.pull_request.base.sha }}
      head_ref: ${{ github.event.pull_request.head.ref }}
      pr_number: ${{ github.event.pull_request.number }}
      selection_json: ${{ needs.classify.outputs.selection_json }}
      release_candidate: false
    permissions:
      contents: read
      security-events: write

  feat-acceptance:
    name: feat-acceptance
    if: always()
    needs: [classify, selective-quality]
    runs-on: ubuntu-latest
    steps:
      - name: Require classification and selected quality
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          QUALITY_RESULT: ${{ needs.selective-quality.result }}
        run: |
          [[ "$CLASSIFY_RESULT" == success && "$QUALITY_RESULT" == success ]]
