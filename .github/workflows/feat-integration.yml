name: Feat integration
run-name: codex-feat-preflight-v1:pr=${{ github.event.pull_request.number }}:event_head=${{ github.event.pull_request.head.sha }}

on:
  pull_request_target:
    branches: ["feat/next"]
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

concurrency:
  group: feat-integration-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  classify:
    name: Classify complete PR diff
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      selection_json: ${{ steps.classify.outputs.selection_json }}
      main_base_sha: ${{ steps.classify.outputs.main_base_sha }}
      preflight_plan: ${{ steps.classify.outputs.preflight_plan }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Classify the event's exact base and head
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GH_TOKEN: ${{ github.token }}
          TRUSTED_SHA: ${{ github.workflow_sha }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ "$HEAD_REPOSITORY" == "$REPOSITORY" ]] || {
            echo 'selective integration currently supports same-repository PRs' >&2
            exit 1
          }
          main_sha="$(gh api "repos/$REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          [[ "$main_sha" =~ ^[0-9a-f]{40}$ ]] || exit 1
          integration_sha="$(gh api "repos/$REPOSITORY/git/ref/heads/feat/next" --jq '.object.sha')"
          [[ "$integration_sha" == "$BASE_SHA" ]] || {
            echo 'feat base advanced after this event; a current snapshot is required' >&2
            exit 1
          }
          git fetch --no-tags origin "$BASE_SHA" "$HEAD_SHA" "$main_sha"
          git merge-base --is-ancestor "$BASE_SHA" "$HEAD_SHA" || {
            echo 'source does not contain the current feat base; update the PR before preflight' >&2
            exit 1
          }
          changes="$RUNNER_TEMP/changed-paths.z"
          git diff --find-renames=50% --find-copies=50% --find-copies-harder \
            --name-status -z "$main_sha...$HEAD_SHA" > "$changes"
          selection="$(python3 scripts/ci_change_scope.py --name-status "$changes" --release-candidate)"
          plan=''
          if [[ "$(jq -r '.binary_impact' <<<"$selection")" == true ]]; then
            plan="$(python3 .github/scripts/release_preflight.py plan \
              --source "$HEAD_SHA" --main "$main_sha" --workflow "$TRUSTED_SHA")"
          fi
          printf 'selection_json=%s\nmain_base_sha=%s\npreflight_plan=%s\n' \
            "$selection" "$main_sha" "$plan" >> "$GITHUB_OUTPUT"

  selective-quality:
    name: Run selected advisory quality
    needs: [classify]
    uses: ./.github/workflows/selective-quality.yml
    with:
      source_sha: ${{ github.event.pull_request.head.sha }}
      base_sha: ${{ needs.classify.outputs.main_base_sha }}
      head_ref: ${{ github.event.pull_request.head.ref }}
      pr_number: ${{ github.event.pull_request.number }}
      selection_json: ${{ needs.classify.outputs.selection_json }}
      release_preflight: true
      preflight_plan: ${{ needs.classify.outputs.preflight_plan }}
      release_candidate: false
    permissions:
      contents: read
      security-events: write
