name: Linux UI quality (reusable)

on:
  workflow_call:
    inputs:
      source_sha:
        description: Immutable source commit selected by the trusted caller
        required: true
        type: string
      release_preflight:
        description: Run release behavior checks without publication authority
        type: boolean
        default: false
      preflight_plan:
        description: Trusted read-only prospective release tree, empty for an actual source
        type: string
        default: ''
      release_candidate:
        description: Whether this is the final main release-candidate path
        required: true
        type: boolean

permissions:
  contents: read

jobs:
  linux-ui-quality:
    name: linux-ui-quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Reconstruct the trusted planned release tree
        if: inputs.preflight_plan != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TRUSTED_SHA: ${{ github.workflow_sha }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          PLAN: ${{ inputs.preflight_plan }}
          RELEASE_CANDIDATE: ${{ inputs.release_candidate }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_CANDIDATE" == false ]] || {
            echo 'a prospective tree cannot publish a release candidate' >&2
            exit 1
          }
          [[ "$TRUSTED_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          trusted="$RUNNER_TEMP/planned-release-trusted"
          mkdir -p "$trusted/.github/scripts" "$trusted/scripts"
          for file in .github/scripts/release_preflight.py scripts/product_version.py; do
            gh api "repos/$REPOSITORY/contents/$file?ref=$TRUSTED_SHA" \
              --jq '.content' | base64 --decode > "$trusted/$file"
          done
          python_command=python3
          if [[ "$RUNNER_OS" == Windows ]]; then python_command=python; fi
          "$python_command" "$trusted/.github/scripts/release_preflight.py" apply \
            --source "$SOURCE_SHA" --workflow "$TRUSTED_SHA" --plan "$PLAN"
      - name: Install Linux UI quality tools
        run: sudo apt-get update && sudo apt-get install --no-install-recommends --yes xvfb xauth x11-utils x11-apps libxkbcommon-x11-0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - name: Build native release for UI evaluation
        run: cargo build --release --locked -p codex_info -p codex-info-recorder -p codex-info-rest
      - name: Run startup UI image and failure-state acceptance
        if: inputs.release_preflight || inputs.release_candidate
        run: xvfb-run --auto-servernum --server-args='-screen 0 1280x800x24' bash scripts/x11_startup_visual_gate.sh
      - name: Run graph UI image acceptance
        run: xvfb-run --auto-servernum --server-args='-screen 0 1280x800x24' bash scripts/x11_graph_visual_gate.sh
