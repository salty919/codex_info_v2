name: Windows client (reusable)

on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
      pr_number:
        required: true
        type: string
      release_candidate:
        required: true
        type: boolean

permissions:
  contents: read

jobs:
  windows-quality:
    name: windows-quality
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Run Windows unit tests
        shell: pwsh
        run: |
          dotnet restore windows-client/CodexInfo.WindowsClient.sln --locked-mode
          dotnet format windows-client/CodexInfo.WindowsClient.sln --no-restore --verify-no-changes
          dotnet test windows-client/CodexInfo.WindowsClient.sln --no-restore --configuration Release
      - name: Install locked Inno Setup compiler
        if: inputs.release_candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installerUrl = 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe'
          $expectedSha256 = '0362a383ed217d4c4239b5933866dd96d3eb2102737da92f80f6057a4b40df2f'
          $installer = Join-Path $env:RUNNER_TEMP 'innosetup-7.1.0-x64.exe'

          Invoke-WebRequest -Uri $installerUrl -OutFile $installer

          $actualSha256 = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash
          if (-not $actualSha256.Equals($expectedSha256, [StringComparison]::OrdinalIgnoreCase)) {
            throw "Inno Setup installer SHA-256 mismatch: $actualSha256"
          }

          $signature = Get-AuthenticodeSignature -LiteralPath $installer
          if ($signature.Status -ne [System.Management.Automation.SignatureStatus]::Valid) {
            throw "Inno Setup installer Authenticode status is $($signature.Status)."
          }
          $publisher = $signature.SignerCertificate.GetNameInfo(
            [System.Security.Cryptography.X509Certificates.X509NameType]::SimpleName,
            $false
          )
          if ($publisher -cne 'Pyrsys B.V.') {
            throw "Unexpected Inno Setup installer publisher: $publisher"
          }

          $installProcess = Start-Process -FilePath $installer -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER') -Wait -PassThru
          if ($installProcess.ExitCode -ne 0) {
            throw "Inno Setup installer failed with exit code $($installProcess.ExitCode)."
          }

          $compiler = Join-Path $env:LOCALAPPDATA 'Programs\Inno Setup 7\ISCC.exe'
          if (-not (Test-Path -LiteralPath $compiler -PathType Leaf)) {
            throw 'Inno Setup 7.1.0 compiler was not installed.'
          }
          "INNO_SETUP_COMPILER=$compiler" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build standard Windows setup wizard
        if: inputs.release_candidate
        shell: pwsh
        run: ./windows-client/tools/Build-WindowsInstaller.ps1 -OutputDirectory artifacts/windows-installer
      - name: Upgrade latest published Windows release to the exact candidate
        if: inputs.release_candidate
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          ./windows-client/tools/Test-WindowsInstallerUpgrade.ps1 `
            -CandidateSetup ./artifacts/windows-installer/CodexInfo.WindowsClient.Setup.exe `
            -SourceSha $env:SOURCE_SHA
      - name: Run installed Windows UI Automation E2E
        if: inputs.release_candidate
        shell: pwsh
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          $install = Join-Path $env:LOCALAPPDATA 'Programs\Codex Info Monitor'
          $exe = Join-Path $install 'CodexInfo.WindowsClient.exe'
          $e2eOutput = Join-Path $env:RUNNER_TEMP 'codex-info-windows-e2e'
          try {
            New-Item -ItemType Directory -Path $e2eOutput -Force | Out-Null
            $moveSmokeLog = Join-Path $e2eOutput 'window-move-smoke.log'
            & ./windows-client/tools/Run-WindowsClientE2E.ps1 -ClientPath $exe -OutputDirectory $e2eOutput -Fixture -SourceSha $env:SOURCE_SHA
            "source-sha: $env:SOURCE_SHA" | Set-Content -LiteralPath $moveSmokeLog -Encoding utf8
            $moveSmokeOutput = @(& ./scripts/windows_window_move_smoke.ps1 -ClientPath $exe -AllowPhysicalInput *>&1)
            $moveSmokeOutput | Tee-Object -FilePath $moveSmokeLog -Append
            if ($moveSmokeOutput.Count -eq 0 -or [string]$moveSmokeOutput[-1] -ne 'window-move-smoke: PASS') {
              throw 'Physical window move smoke did not report its terminal PASS contract.'
            }
          }
          finally {
            $uninstaller = Get-ChildItem -LiteralPath $install -Filter 'unins*.exe' -File -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($null -ne $uninstaller) {
              $uninstallProcess = Start-Process -FilePath $uninstaller.FullName -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART') -Wait -PassThru
              if ($uninstallProcess.ExitCode -ne 0) { throw "E2E cleanup uninstall failed with exit code $($uninstallProcess.ExitCode)" }
            }
            $sentinel = Join-Path $env:LOCALAPPDATA 'CodexInfo\installer-preserve-sentinel.txt'
            $start = Join-Path ([Environment]::GetFolderPath('Programs')) 'Codex Info\Codex Info Monitor.lnk'
            $desktop = Join-Path ([Environment]::GetFolderPath('Desktop')) 'Codex Info Monitor.lnk'
            $key = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\CodexInfo.WindowsClient_is1'
            Start-Sleep -Seconds 4
            if (Test-Path -LiteralPath $install) { throw 'Install directory still exists after E2E uninstall.' }
            if (Test-Path -LiteralPath $start) { throw 'Start-menu shortcut still exists after E2E uninstall.' }
            if (Test-Path -LiteralPath $desktop) { throw 'Desktop shortcut still exists after E2E uninstall.' }
            if (Test-Path -LiteralPath $key) { throw 'Apps registration still exists after E2E uninstall.' }
            if (-not (Test-Path -LiteralPath $sentinel -PathType Leaf)) { throw 'E2E uninstall removed user settings.' }
            Remove-Item -LiteralPath $sentinel -Force
          }
      - name: Create release manifest
        id: manifest
        if: inputs.release_candidate
        shell: pwsh
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          ./windows-client/tools/New-WindowsUpdateManifest.ps1 `
            -InstallerPath ./artifacts/windows-installer/CodexInfo.WindowsClient.Setup.exe `
            -OutputPath ./artifacts/windows-installer/CodexInfo.WindowsClient.update.json `
            -Repository $env:REPOSITORY
          $manifestPath = './artifacts/windows-installer/CodexInfo.WindowsClient.update.json'
          try {
            $manifest = Get-Content -LiteralPath $manifestPath -Raw -Encoding utf8 |
              ConvertFrom-Json -ErrorAction Stop
          }
          catch {
            throw "Generated release manifest is not valid JSON: $($_.Exception.Message)"
          }
          if ($manifest -isnot [PSCustomObject]) {
            throw 'Generated release manifest root must be an object.'
          }
          $versionProperties = @($manifest.PSObject.Properties | Where-Object { $_.Name -ceq 'version' })
          if ($versionProperties.Count -ne 1 -or $versionProperties[0].Value -isnot [string]) {
            throw 'Generated release manifest must contain exactly one string version.'
          }
          $version = [string]$versionProperties[0].Value
          if ($version -cnotmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
            throw "Generated release manifest version is not canonical stable semver: $version"
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Upload release candidate
        if: inputs.release_candidate
        uses: actions/upload-artifact@v4
        with:
          name: release-candidate-v1-pr-${{ inputs.pr_number }}-head-${{ inputs.source_sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}-version-${{ steps.manifest.outputs.version }}
          path: |
            artifacts/windows-installer/CodexInfo.WindowsClient.Setup.exe
            artifacts/windows-installer/CodexInfo.WindowsClient.update.json
          if-no-files-found: error
