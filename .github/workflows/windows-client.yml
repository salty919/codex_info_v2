name: Windows client (reusable)

on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
      pr_number:
        required: true
        type: string
      release_candidate:
        required: true
        type: boolean

permissions:
  contents: read

jobs:
  windows-quality:
    name: windows-quality
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Run Windows unit tests
        shell: pwsh
        env:
          COVERAGE_ROOT: ${{ runner.temp }}\codacy-coverage-dotnet
        run: |
          dotnet restore windows-client/CodexInfo.WindowsClient.sln --locked-mode
          dotnet format windows-client/CodexInfo.WindowsClient.sln --no-restore --verify-no-changes
          dotnet test windows-client/CodexInfo.WindowsClient.sln `
            --no-restore `
            --configuration Release `
            -p:DeterministicSourcePaths=true `
            --collect:"Code Coverage" `
            --settings windows-client/CodeCoverage.runsettings `
            --results-directory $env:COVERAGE_ROOT

          $reports = @(Get-ChildItem -LiteralPath $env:COVERAGE_ROOT -Recurse -File -Filter '*.cobertura.xml')
          if ($reports.Count -eq 0) {
            throw 'Windows tests produced no Cobertura report.'
          }
          $staging = Join-Path $env:GITHUB_WORKSPACE 'artifacts\codacy-coverage-windows'
          New-Item -ItemType Directory -Path $staging -Force | Out-Null
          $utf8 = [System.Text.UTF8Encoding]::new($false)
          for ($index = 0; $index -lt $reports.Count; $index++) {
            $content = [System.IO.File]::ReadAllText($reports[$index].FullName)
            $content = $content.Replace('filename="/_/', 'filename="')
            if ($content -cnotmatch 'lines-valid="[1-9][0-9]*"') {
              throw "Cobertura report has no valid lines: $($reports[$index].Name)"
            }
            if ($content -cmatch 'filename="(?:/|[A-Za-z]:[\\/])') {
              throw "Cobertura report contains a runner-specific path: $($reports[$index].Name)"
            }
            $output = Join-Path $staging ("windows-{0}.cobertura.xml" -f ($index + 1))
            [System.IO.File]::WriteAllText($output, $content, $utf8)
          }
      - name: Preserve Windows coverage for isolated upload
        uses: actions/upload-artifact@v4
        with:
          name: codacy-coverage-windows-v1-head-${{ inputs.source_sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: artifacts/codacy-coverage-windows/*.cobertura.xml
          if-no-files-found: error
      - name: Install locked Inno Setup compiler
        if: inputs.release_candidate
        shell: pwsh
        run: ./windows-client/tools/Ensure-InnoSetupCompiler.ps1
      - name: Build standard Windows setup wizard
        if: inputs.release_candidate
        shell: pwsh
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: >-
          ./windows-client/tools/Build-WindowsInstaller.ps1
          -OutputDirectory artifacts/windows-installer
          -SourceSha $env:SOURCE_SHA
      - name: Upgrade latest published Windows release to the exact candidate
        if: inputs.release_candidate
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: >-
          ./windows-client/tools/Install-WindowsCandidateForE2E.ps1
          -SourceSha $env:SOURCE_SHA
          -CandidateSetup ./artifacts/windows-installer/CodexInfo.WindowsClient.Setup.exe
          -RetainSentinel
      - name: Run installed Windows UI Automation E2E
        if: inputs.release_candidate
        shell: pwsh
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          $e2eOutput = Join-Path $env:RUNNER_TEMP 'codex-info-windows-e2e'
          ./windows-client/tools/Reproduce-WindowsInstalledE2E.ps1 `
            -SourceSha $env:SOURCE_SHA `
            -OutputDirectory $e2eOutput `
            -CleanupInstallation
      - name: Create release manifest
        id: manifest
        if: inputs.release_candidate
        shell: pwsh
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          ./windows-client/tools/New-WindowsUpdateManifest.ps1 `
            -InstallerPath ./artifacts/windows-installer/CodexInfo.WindowsClient.Setup.exe `
            -OutputPath ./artifacts/windows-installer/CodexInfo.WindowsClient.update.json `
            -Repository $env:REPOSITORY
          $manifestPath = './artifacts/windows-installer/CodexInfo.WindowsClient.update.json'
          try {
            $manifest = Get-Content -LiteralPath $manifestPath -Raw -Encoding utf8 |
              ConvertFrom-Json -ErrorAction Stop
          }
          catch {
            throw "Generated release manifest is not valid JSON: $($_.Exception.Message)"
          }
          if ($manifest -isnot [PSCustomObject]) {
            throw 'Generated release manifest root must be an object.'
          }
          $versionProperties = @($manifest.PSObject.Properties | Where-Object { $_.Name -ceq 'version' })
          if ($versionProperties.Count -ne 1 -or $versionProperties[0].Value -isnot [string]) {
            throw 'Generated release manifest must contain exactly one string version.'
          }
          $version = [string]$versionProperties[0].Value
          if ($version -cnotmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
            throw "Generated release manifest version is not canonical stable semver: $version"
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Upload release candidate
        if: inputs.release_candidate
        uses: actions/upload-artifact@v4
        with:
          name: release-candidate-v1-pr-${{ inputs.pr_number }}-head-${{ inputs.source_sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}-version-${{ steps.manifest.outputs.version }}
          path: |
            artifacts/windows-installer/CodexInfo.WindowsClient.Setup.exe
            artifacts/windows-installer/CodexInfo.WindowsClient.update.json
          if-no-files-found: error
