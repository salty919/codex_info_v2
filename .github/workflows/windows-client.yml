name: Windows client (reusable)

on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
      release_candidate:
        required: true
        type: boolean
      powershell_paths_json:
        required: true
        type: string

permissions:
  contents: read

jobs:
  windows-quality:
    name: windows-quality
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Run Windows unit tests
        shell: bash
        env:
          POWERSHELL_PATHS_JSON: ${{ inputs.powershell_paths_json }}
        run: bash scripts/windows_client_contract_gate.sh
      - name: Build standard Windows setup wizard
        if: inputs.release_candidate
        shell: pwsh
        run: ./windows-client/tools/Build-WindowsInstaller.ps1 -InstallCompiler -OutputDirectory artifacts/windows-installer
      - name: Smoke-test install and uninstall lifecycle
        if: inputs.release_candidate
        shell: pwsh
        run: ./windows-client/tools/Test-WindowsInstallerLifecycle.ps1 -InstallerPath ./artifacts/windows-installer/CodexInfo.WindowsClient.Setup.exe -SourceSha '${{ inputs.source_sha }}'
      - name: Create release manifest
        id: manifest
        if: inputs.release_candidate
        shell: pwsh
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          $version = ./windows-client/tools/New-WindowsUpdateManifest.ps1 `
            -InstallerPath ./artifacts/windows-installer/CodexInfo.WindowsClient.Setup.exe `
            -OutputPath ./artifacts/windows-installer/CodexInfo.WindowsClient.update.json `
            -Repository $env:REPOSITORY `
            -PassThruVersion
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Upload release candidate
        if: inputs.release_candidate
        uses: actions/upload-artifact@v4
        with:
          name: release-candidate-windows-v1-version-${{ steps.manifest.outputs.version }}
          path: |
            artifacts/windows-installer/CodexInfo.WindowsClient.Setup.exe
            artifacts/windows-installer/CodexInfo.WindowsClient.update.json
          if-no-files-found: error
