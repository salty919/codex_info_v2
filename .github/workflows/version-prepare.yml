name: Main PR quality
run-name: codex-main-quality-v1:pr=${{ github.event.pull_request.number }}:event_head=${{ github.event.pull_request.head.sha }}:action=${{ github.event.action }}:draft=${{ github.event.pull_request.draft }}

on:
  pull_request_target:
    branches: ["main"]
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

concurrency:
  group: main-pr-quality-${{ github.event.pull_request.number }}
  # A generated-H1 observer consumes the preceding H0 result. Serialize the
  # same PR so that the observer cannot cancel its producer.
  cancel-in-progress: false

jobs:
  version-prepared:
    name: version-prepared
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      pull-requests: read
    outputs:
      ready: ${{ steps.prepare.outputs.ready }}
      selection_json: ${{ steps.prepare.outputs.selection_json }}
      quality_sha: ${{ steps.prepare.outputs.quality_sha }}
      generated_head: ${{ steps.prepare.outputs.generated_head }}
      generated_observer: ${{ steps.prepare.outputs.generated_observer }}
      event_observer: ${{ steps.current.outputs.observer }}
      observer_reason: ${{ steps.current.outputs.reason }}
    steps:
      - name: Read the current pull request once
        id: current
        env:
          EVENT_DRAFT: ${{ github.event.pull_request.draft }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || {
            echo 'event PR number is malformed' >&2
            exit 1
          }
          [[ "$EVENT_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo 'event PR head is malformed' >&2
            exit 1
          }
          [[ "$EVENT_DRAFT" == true || "$EVENT_DRAFT" == false ]] || {
            echo 'event PR draft state is malformed' >&2
            exit 1
          }

          current_pr="$(gh api -H 'Accept: application/vnd.github+json' \
            "repos/$REPOSITORY/pulls/$PR_NUMBER")"
          read -r current_head current_draft current_state < <(
            jq -er --argjson number "$PR_NUMBER" --arg repository "$REPOSITORY" '
              select(.number == $number and
                     (.state == "open" or .state == "closed") and
                     .base.repo.full_name == $repository and
                     (.draft | type) == "boolean" and
                     (.head.sha | type) == "string" and
                     (.head.sha | test("^[0-9a-f]{40}$"))) |
              [.head.sha, (.draft | tostring), .state] | @tsv
            ' <<<"$current_pr"
          )

          observer=false
          reason=owner
          if [[ "$current_state" == closed ]]; then
            observer=true
            reason=closed-pr
          elif [[ "$EVENT_DRAFT" == true ]]; then
            observer=true
            reason=event-draft
          elif [[ "$current_draft" == true ]]; then
            observer=true
            reason=current-draft
          elif [[ "$current_head" != "$EVENT_HEAD_SHA" ]]; then
            observer=true
            reason=stale-event-head
          fi
          printf 'observer=%s\nreason=%s\n' "$observer" "$reason" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.current.outputs.observer != 'true'
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Select owners and prepare the binary version
        id: prepare
        if: steps.current.outputs.observer != 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_ACTION: ${{ github.event.action }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ "$HEAD_REPOSITORY" == "$REPOSITORY" ]] || {
            echo 'automatic version preparation requires a same-repository PR' >&2
            exit 1
          }
          git fetch --no-tags origin "$HEAD_SHA"

          versions="$RUNNER_TEMP/versions"
          mkdir -p "$versions/base/windows-client" "$versions/head/windows-client"
          extract_versions() {
            local revision="$1" destination="$2"
            git show "$revision:Cargo.toml" > "$destination/Cargo.toml"
            git show "$revision:Cargo.lock" > "$destination/Cargo.lock"
            git show "$revision:windows-client/Directory.Build.props" > "$destination/windows-client/Directory.Build.props"
          }
          read_version() {
            python3 scripts/product_version.py check \
              --cargo-toml "$1/Cargo.toml" \
              --cargo-lock "$1/Cargo.lock" \
              --windows-props "$1/windows-client/Directory.Build.props" |
              sed -n 's/^version=//p'
          }

          extract_versions "$BASE_SHA" "$versions/base"
          extract_versions "$HEAD_SHA" "$versions/head"
          base_version="$(read_version "$versions/base")"
          head_version="$(read_version "$versions/head")"
          next_version="$(python3 scripts/product_version.py next --version "$base_version" | sed -n 's/^version=//p')"

          # Locate the newest first-parent commit that changed a version file.
          # This keeps later user commits in the owner diff while excluding a
          # byte-exact workflow-generated version transition.
          expected_version_transition=false
          version_commit="$(git log --first-parent --format=%H -n 1 \
            "$BASE_SHA..$HEAD_SHA" -- \
            Cargo.toml Cargo.lock windows-client/Directory.Build.props)"
          if [[ -n "$version_commit" && "$head_version" == "$next_version" ]]; then
            read -r -a version_line <<<"$(git rev-list --parents -n 1 "$version_commit")"
          else
            version_line=()
          fi
          if [[ "${#version_line[@]}" -eq 2 ]]; then
            parent_sha="${version_line[1]}"
            mapfile -t last_paths < <(git diff --name-only "$parent_sha" "$version_commit" | LC_ALL=C sort)
            expected_paths=(Cargo.lock Cargo.toml windows-client/Directory.Build.props)
            if [[ "${last_paths[*]}" == "${expected_paths[*]}" ]]; then
              mkdir -p \
                "$versions/parent/windows-client" \
                "$versions/generated/windows-client" \
                "$versions/expected/windows-client"
              extract_versions "$parent_sha" "$versions/parent"
              extract_versions "$version_commit" "$versions/generated"
              cp "$versions/parent/Cargo.toml" "$versions/expected/Cargo.toml"
              cp "$versions/parent/Cargo.lock" "$versions/expected/Cargo.lock"
              cp "$versions/parent/windows-client/Directory.Build.props" "$versions/expected/windows-client/Directory.Build.props"
              parent_version="$(read_version "$versions/parent")"
              if [[ "$parent_version" == "$base_version" ]]; then
                python3 scripts/product_version.py bump --expected "$base_version" \
                  --cargo-toml "$versions/expected/Cargo.toml" \
                  --cargo-lock "$versions/expected/Cargo.lock" \
                  --windows-props "$versions/expected/windows-client/Directory.Build.props"
                if cmp -s "$versions/expected/Cargo.toml" "$versions/generated/Cargo.toml" && \
                   cmp -s "$versions/expected/Cargo.lock" "$versions/generated/Cargo.lock" && \
                   cmp -s "$versions/expected/windows-client/Directory.Build.props" "$versions/generated/windows-client/Directory.Build.props" && \
                   cmp -s "$versions/expected/Cargo.toml" "$versions/head/Cargo.toml" && \
                   cmp -s "$versions/expected/Cargo.lock" "$versions/head/Cargo.lock" && \
                   cmp -s "$versions/expected/windows-client/Directory.Build.props" "$versions/head/windows-client/Directory.Build.props"; then
                  expected_version_transition=true
                fi
              fi
            fi
          fi

          changes="$RUNNER_TEMP/changed-paths.z"
          if [[ "$expected_version_transition" == true ]]; then
            git diff --find-renames=50% --find-copies=50% --find-copies-harder \
              --name-status -z "$BASE_SHA...$HEAD_SHA" -- . \
              ':(exclude)Cargo.toml' \
              ':(exclude)Cargo.lock' \
              ':(exclude)windows-client/Directory.Build.props' > "$changes"
          else
            git diff --find-renames=50% --find-copies=50% --find-copies-harder \
              --name-status -z "$BASE_SHA...$HEAD_SHA" > "$changes"
          fi
          selection="$(python3 scripts/ci_change_scope.py --name-status "$changes")"
          binary_impact="$(jq -r '.binary_impact' <<<"$selection")"

          if [[ "$binary_impact" == false ]]; then
            [[ "$head_version" == "$base_version" ]] || {
              echo 'a non-binary PR must not change the product version' >&2
              exit 1
            }
            printf 'ready=true\nselection_json=%s\nquality_sha=%s\ngenerated_head=false\ngenerated_observer=false\n' \
              "$selection" "$HEAD_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$head_version" == "$next_version" ]]; then
            # A generated H1 is a tip-only exact transition whose five
            # trailers resolve to the trusted default-branch workflow run that
            # observed its sole parent H0. Invalid or absent identity leaves a
            # byte-identical manual H1 (and every later H2) with the owner path.
            generated_h1=false
            if [[ "$EVENT_ACTION" == synchronize && \
                  "$expected_version_transition" == true && \
                  "$version_commit" == "$HEAD_SHA" && \
                  "${#version_line[@]}" -eq 2 ]]; then
              commit_message="$(git show -s --format=%B "$HEAD_SHA")"
              trailer_value() {
                local key="$1"
                local -a values
                mapfile -t values < <(sed -n "s/^${key}: //p" <<<"$commit_message")
                [[ "${#values[@]}" -eq 1 ]] || return 1
                printf '%s' "${values[0]}"
              }
              generator_schema=''
              generator_pr=''
              generator_event_head=''
              generator_run_id=''
              generator_run_attempt=''
              if generator_schema="$(trailer_value Codex-Version-Prepare-Schema)" && \
                 generator_pr="$(trailer_value Codex-Version-Prepare-PR)" && \
                 generator_event_head="$(trailer_value Codex-Version-Prepare-Event-Head)" && \
                 generator_run_id="$(trailer_value Codex-Version-Prepare-Run-ID)" && \
                 generator_run_attempt="$(trailer_value Codex-Version-Prepare-Run-Attempt)"; then
                expected_generated_message="$(printf '%s\n\n%s\n%s\n%s\n%s\n%s' \
                  "chore: prepare version $head_version" \
                  'Codex-Version-Prepare-Schema: v1' \
                  "Codex-Version-Prepare-PR: $generator_pr" \
                  "Codex-Version-Prepare-Event-Head: $generator_event_head" \
                  "Codex-Version-Prepare-Run-ID: $generator_run_id" \
                  "Codex-Version-Prepare-Run-Attempt: $generator_run_attempt")"
                if [[ "$commit_message" == "$expected_generated_message" && \
                      "$generator_schema" == v1 && \
                      "$generator_pr" == "$PR_NUMBER" && \
                      "$generator_event_head" == "$parent_sha" && \
                      "$generator_run_id" =~ ^[1-9][0-9]*$ && \
                      "$generator_run_attempt" =~ ^[1-9][0-9]*$ ]]; then
                  generator_run=''
                  if generator_run="$(gh api -H 'Accept: application/vnd.github+json' \
                       "repos/$REPOSITORY/actions/runs/$generator_run_id/attempts/$generator_run_attempt" 2>/dev/null)"; then
                    generator_title="$(jq -er '.display_title | select(type == "string")' <<<"$generator_run")"
                    metadata_matches=false
                    case "$generator_title" in
                      "codex-main-quality-v1:pr=$PR_NUMBER:event_head=$parent_sha:action=opened:draft=false"|\
                      "codex-main-quality-v1:pr=$PR_NUMBER:event_head=$parent_sha:action=synchronize:draft=false"|\
                      "codex-main-quality-v1:pr=$PR_NUMBER:event_head=$parent_sha:action=reopened:draft=false"|\
                      "codex-main-quality-v1:pr=$PR_NUMBER:event_head=$parent_sha:action=ready_for_review:draft=false")
                        metadata_matches=true
                        ;;
                    esac
                    if [[ "$metadata_matches" == true ]] && \
                       jq -e \
                         --arg attempt "$generator_run_attempt" \
                         --arg id "$generator_run_id" \
                         --arg repository "$REPOSITORY" '
                           select((.id | tostring) == $id and
                                  (.run_attempt | tostring) == $attempt and
                                  (.path | type) == "string" and
                                  ((.path | split("@")[0]) == ".github/workflows/version-prepare.yml") and
                                  .event == "pull_request_target" and
                                  .repository.full_name == $repository)
                         ' <<<"$generator_run" >/dev/null; then
                      generated_h1=true
                    fi
                  fi
                fi
              fi
            fi
            if [[ "$generated_h1" == true ]]; then
              printf 'ready=false\nselection_json=%s\nquality_sha=%s\ngenerated_head=false\ngenerated_observer=true\n' \
                "$selection" "$HEAD_SHA" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            printf 'ready=true\nselection_json=%s\nquality_sha=%s\ngenerated_head=false\ngenerated_observer=false\n' \
              "$selection" "$HEAD_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ "$head_version" == "$base_version" ]] || {
            echo "binary PR version must be $base_version or $next_version; found $head_version" >&2
            exit 1
          }

          mkdir -p "$versions/next/windows-client"
          cp "$versions/head/Cargo.toml" "$versions/next/Cargo.toml"
          cp "$versions/head/Cargo.lock" "$versions/next/Cargo.lock"
          cp "$versions/head/windows-client/Directory.Build.props" "$versions/next/windows-client/Directory.Build.props"
          python3 scripts/product_version.py bump --expected "$base_version" \
            --cargo-toml "$versions/next/Cargo.toml" \
            --cargo-lock "$versions/next/Cargo.lock" \
            --windows-props "$versions/next/windows-client/Directory.Build.props"

          export GIT_INDEX_FILE="$RUNNER_TEMP/version.index"
          git read-tree "$HEAD_SHA^{tree}"
          cargo_toml_blob="$(git hash-object -w "$versions/next/Cargo.toml")"
          cargo_lock_blob="$(git hash-object -w "$versions/next/Cargo.lock")"
          windows_props_blob="$(git hash-object -w "$versions/next/windows-client/Directory.Build.props")"
          git update-index --add --cacheinfo "100644,$cargo_toml_blob,Cargo.toml"
          git update-index --add --cacheinfo "100644,$cargo_lock_blob,Cargo.lock"
          git update-index --add --cacheinfo "100644,$windows_props_blob,windows-client/Directory.Build.props"
          tree_sha="$(git write-tree)"
          export GIT_AUTHOR_NAME='github-actions[bot]'
          export GIT_AUTHOR_EMAIL='41898282+github-actions[bot]@users.noreply.github.com'
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          [[ "$GITHUB_RUN_ID" =~ ^[1-9][0-9]*$ && "$GITHUB_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]] || {
            echo 'workflow run identity is malformed' >&2
            exit 1
          }
          commit_message="$(printf '%s\n\n%s\n%s\n%s\n%s\n%s\n' \
            "chore: prepare version $next_version" \
            'Codex-Version-Prepare-Schema: v1' \
            "Codex-Version-Prepare-PR: $PR_NUMBER" \
            "Codex-Version-Prepare-Event-Head: $HEAD_SHA" \
            "Codex-Version-Prepare-Run-ID: $GITHUB_RUN_ID" \
            "Codex-Version-Prepare-Run-Attempt: $GITHUB_RUN_ATTEMPT")"
          commit_sha="$(printf '%s\n' "$commit_message" | git commit-tree "$tree_sha" -p "$HEAD_SHA")"

          # A concurrent head update makes this non-force push fail. No ref
          # pre-read, retry, or overwrite path exists.
          git push origin "$commit_sha:refs/heads/$HEAD_REF"
          printf 'ready=true\nselection_json=%s\nquality_sha=%s\ngenerated_head=true\ngenerated_observer=false\n' \
            "$selection" "$commit_sha" >> "$GITHUB_OUTPUT"

  selective-quality:
    name: Run selected quality owners
    needs: [version-prepared]
    if: needs.version-prepared.outputs.ready == 'true'
    uses: ./.github/workflows/selective-quality.yml
    with:
      source_sha: ${{ needs.version-prepared.outputs.quality_sha }}
      base_sha: ${{ github.event.pull_request.base.sha }}
      head_ref: ${{ github.event.pull_request.head.ref }}
      pr_number: ${{ github.event.pull_request.number }}
      selection_json: ${{ needs.version-prepared.outputs.selection_json }}
      release_candidate: true
    permissions:
      contents: read
      security-events: write

  acceptance:
    name: ${{ needs.version-prepared.outputs.event_observer == 'true' && 'Observe non-authoritative PR event' || needs.version-prepared.outputs.generated_observer == 'true' && 'Observe generated H1' || 'acceptance' }}
    if: always()
    needs: [version-prepared, selective-quality]
    runs-on: ubuntu-latest
    permissions:
      checks: write
    steps:
      - name: Require selected quality success
        env:
          GENERATED_HEAD: ${{ needs.version-prepared.outputs.generated_head }}
          GENERATED_OBSERVER: ${{ needs.version-prepared.outputs.generated_observer }}
          EVENT_OBSERVER: ${{ needs.version-prepared.outputs.event_observer }}
          GH_TOKEN: ${{ github.token }}
          PREPARE_RESULT: ${{ needs.version-prepared.result }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          QUALITY_SHA: ${{ needs.version-prepared.outputs.quality_sha }}
          QUALITY_RESULT: ${{ needs.selective-quality.result }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          conclusion=failure
          if [[ "$PREPARE_RESULT" == success && "$QUALITY_RESULT" == success ]]; then
            conclusion=success
          fi
          if [[ "$PREPARE_RESULT" == success && "$GENERATED_OBSERVER" == true && "$QUALITY_RESULT" == skipped ]]; then
            conclusion=success
          fi
          if [[ "$PREPARE_RESULT" == success && "$EVENT_OBSERVER" == true && "$QUALITY_RESULT" == skipped ]]; then
            conclusion=success
          fi

          # GITHUB_TOKEN pushes do not start another workflow run. Only the
          # generated H1 therefore needs final checks copied from this H0 run.
          if [[ "$GENERATED_HEAD" == true ]]; then
            external_id="codex-main-quality:pr=$PR_NUMBER:head=$QUALITY_SHA:run=$GITHUB_RUN_ID:attempt=$GITHUB_RUN_ATTEMPT"
            create_check() {
              local name="$1" result="$2"
              jq -nc \
                --arg name "$name" \
                --arg head "$QUALITY_SHA" \
                --arg result "$result" \
                --arg external "$external_id" \
                '{name:$name,head_sha:$head,status:"completed",conclusion:$result,external_id:$external}' |
                gh api --method POST "repos/$REPOSITORY/check-runs" --input - >/dev/null
            }
            create_check version-prepared success
            create_check acceptance "$conclusion"
          fi
          [[ "$conclusion" == success ]]
