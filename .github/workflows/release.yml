name: Release Windows client

on:
  pull_request_target:
    branches: ["main"]
    types: [closed]

permissions:
  contents: read

concurrency:
  group: release-windows-client-main
  cancel-in-progress: false

jobs:
  release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      actions: read
      checks: read
      contents: write
    steps:
      - name: Resolve the successful final-head quality run
        id: quality
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          external_prefix="codex-main-quality:pr=$PR_NUMBER:head=$HEAD_SHA:run="
          checks="$(gh api -H 'Accept: application/vnd.github+json' \
            "repos/$REPOSITORY/commits/$HEAD_SHA/check-runs?check_name=acceptance&filter=latest&per_page=100")"
          runs="$(gh api \
            "repos/$REPOSITORY/actions/workflows/version-prepare.yml/runs?event=pull_request_target&head_sha=$HEAD_SHA&per_page=100")"
          mapfile -t external_ids < <(
            jq -r --arg prefix "$external_prefix" '
              .check_runs[] |
              .external_id? as $external |
              select(($external | type) == "string" and ($external | startswith($prefix))) |
              ($external | ltrimstr($prefix)) |
              select(test("^[1-9][0-9]*$"))
            ' <<<"$checks" | sort -n -u
          )
          mapfile -t direct_ids < <(
            jq -r --arg head "$HEAD_SHA" '
              .workflow_runs[] |
              select(.path == ".github/workflows/version-prepare.yml") |
              select(.event == "pull_request_target" and .head_sha == $head) |
              .id
            ' <<<"$runs" | sort -n -u
          )
          external_id=''
          direct_id=''
          [[ "${#external_ids[@]}" -eq 0 ]] || external_id="${external_ids[-1]}"
          [[ "${#direct_ids[@]}" -eq 0 ]] || direct_id="${direct_ids[-1]}"
          [[ -n "$external_id" || -n "$direct_id" ]] || {
            echo 'no quality run owns the merged PR head' >&2
            exit 1
          }

          # A successful generated-H1 observer deliberately runs no owners. It
          # cannot replace the H0 producer identified by the final-head check.
          observer=false
          if [[ -n "$direct_id" ]]; then
            direct_run="$(gh api "repos/$REPOSITORY/actions/runs/$direct_id")"
            direct_jobs="$(gh api "repos/$REPOSITORY/actions/runs/$direct_id/jobs?filter=latest&per_page=100")"
            if jq -e --argjson id "$direct_id" --arg head "$HEAD_SHA" '
                 select(.id == $id and
                        .path == ".github/workflows/version-prepare.yml" and
                        .event == "pull_request_target" and
                        .head_sha == $head and
                        .conclusion == "success")
               ' <<<"$direct_run" >/dev/null &&
               jq -e '
                 [.jobs[] | select(.name == "Observe generated H1" and .conclusion == "success")] |
                 length == 1
               ' <<<"$direct_jobs" >/dev/null; then
              observer=true
            fi
          fi
          if [[ "$observer" == true ]]; then
            [[ -n "$external_id" ]] || {
              echo 'generated-H1 observer has no completed producer' >&2
              exit 1
            }
            run_id="$external_id"
          else
            run_id="$(printf '%s\n' "$external_id" "$direct_id" | sed '/^$/d' | sort -n | tail -n 1)"
          fi
          if [[ -n "$direct_id" && "$run_id" == "$direct_id" ]]; then
            run="$direct_run"
            jobs="$direct_jobs"
          else
            run="$(gh api "repos/$REPOSITORY/actions/runs/$run_id")"
            jobs="$(gh api "repos/$REPOSITORY/actions/runs/$run_id/jobs?filter=latest&per_page=100")"
          fi
          jq -e \
            --argjson id "$run_id" \
            'select(.id == $id and
                    .path == ".github/workflows/version-prepare.yml" and
                    .event == "pull_request_target" and
                    .conclusion == "success")' \
            <<<"$run" >/dev/null
          windows_result="$(jq -er '
            [.jobs[] | select(.name | test("(^| / )windows-quality$"))] |
            if length == 1 then .[0].conclusion else error("Windows job is missing or duplicated") end
          ' <<<"$jobs")"
          case "$windows_result" in
            skipped) publish=false ;;
            success) publish=true ;;
            *) echo "Windows quality did not complete successfully: $windows_result" >&2; exit 1 ;;
          esac
          printf 'publish=%s\nrun_id=%s\n' "$publish" "$run_id" >> "$GITHUB_OUTPUT"

      - name: Download the accepted release candidate
        if: steps.quality.outputs.publish == 'true'
        uses: actions/download-artifact@v4
        with:
          name: release-candidate-${{ github.event.pull_request.number }}
          run-id: ${{ steps.quality.outputs.run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: release-candidate

      - name: Publish the Windows release
        if: steps.quality.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          setup=release-candidate/CodexInfo.WindowsClient.Setup.exe
          manifest=release-candidate/CodexInfo.WindowsClient.update.json
          version="$(jq -er '
            .version |
            select(type == "string" and test("^(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)$"))
          ' "$manifest")"
          tag="windows-v$version"
          gh release create "$tag" "$setup" "$manifest" \
            --repo "$REPOSITORY" \
            --target "$MERGE_SHA" \
            --title "Codex Info Monitor $version" \
            --notes "Windows client $version" \
            --draft
          gh release edit "$tag" --repo "$REPOSITORY" --draft=false
