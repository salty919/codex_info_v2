name: Release product

on:
  pull_request_target:
    branches: ["main"]
    types: [closed]
  workflow_run:
    workflows: ["Main PR quality"]
    types: [completed]

permissions: {}

jobs:
  resolve:
    name: Resolve exact final-head candidate
    if: >-
      (github.event_name == 'pull_request_target' && github.event.pull_request.merged) ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      publish: ${{ steps.resolve.outputs.publish }}
      snapshot: ${{ steps.resolve.outputs.snapshot }}
      artifact_ids: ${{ steps.resolve.outputs.artifact_ids }}
      run_id: ${{ steps.resolve.outputs.run_id }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Resolve immutable release authority
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/release_authority.py \
            --event "$GITHUB_EVENT_PATH" \
            --event-name "${{ github.event_name }}" \
            --repository "${{ github.repository }}" \
            --output "$GITHUB_OUTPUT"

  publish:
    name: Publish immutable release
    needs: [resolve]
    if: needs.resolve.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: release-product-${{ needs.resolve.outputs.tag }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Download immutable platform candidates
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.resolve.outputs.artifact_ids }}
          run-id: ${{ needs.resolve.outputs.run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: release-candidate
          merge-multiple: true
      - name: Mint the current-repository release token
        id: release-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
      - name: Revalidate authority immediately before publication
        env:
          EXPECTED_SNAPSHOT: ${{ needs.resolve.outputs.snapshot }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/release_authority.py \
            --event "$GITHUB_EVENT_PATH" \
            --event-name "${{ github.event_name }}" \
            --repository "${{ github.repository }}" \
            --expect "$EXPECTED_SNAPSHOT"
      - name: Publish or verify the exact release state
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TOKEN: ${{ steps.release-token.outputs.token }}
          SNAPSHOT: ${{ needs.resolve.outputs.snapshot }}
        run: |
          python3 scripts/publish_release.py \
            --snapshot "$SNAPSHOT" \
            --candidate-dir release-candidate \
            --repository "${{ github.repository }}"
