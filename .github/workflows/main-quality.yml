name: Main PR quality

on:
  pull_request_target:
    branches: ["main"]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]

permissions: {}

concurrency:
  group: main-pr-quality-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  classify:
    name: Classify diff and validate version
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      selection_json: ${{ steps.classify.outputs.selection_json }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve release quality owners
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          selection="$(python3 scripts/resolve_pr_quality.py \
            --base "$BASE_SHA" --head "$HEAD_SHA" \
            --repository "$REPOSITORY" --head-repository "$HEAD_REPOSITORY" \
            --release-candidate)"
          printf 'selection_json=%s\n' "$selection" >> "$GITHUB_OUTPUT"

  selective-quality:
    name: Run selected release quality
    needs: [classify]
    uses: ./.github/workflows/selective-quality.yml
    with:
      source_sha: ${{ github.event.pull_request.head.sha }}
      base_sha: ${{ github.event.pull_request.base.sha }}
      head_ref: ${{ github.event.pull_request.head.ref }}
      selection_json: ${{ needs.classify.outputs.selection_json }}
      release_candidate: true
    permissions:
      contents: read
      security-events: write
