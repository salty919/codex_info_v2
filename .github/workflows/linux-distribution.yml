name: Linux distribution (reusable)

on:
  workflow_call:
    inputs:
      source_sha:
        description: Immutable source commit selected by the trusted caller
        required: true
        type: string
      pr_number:
        description: Pull request number used in the candidate identity
        required: true
        type: string
      release_preflight:
        description: Run release behavior checks without publication authority
        type: boolean
        default: false
      preflight_plan:
        description: Trusted read-only prospective release tree, empty for an actual source
        type: string
        default: ''
      release_candidate:
        description: Whether this run may publish a pre-merge candidate
        required: true
        type: boolean

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  LINUX_BUNDLE_TARGET: x86_64-unknown-linux-gnu

jobs:
  linux-distribution:
    name: linux-distribution
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Reconstruct the trusted planned release tree
        if: inputs.preflight_plan != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TRUSTED_SHA: ${{ github.workflow_sha }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          PLAN: ${{ inputs.preflight_plan }}
          RELEASE_CANDIDATE: ${{ inputs.release_candidate }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_CANDIDATE" == false ]] || {
            echo 'a prospective tree cannot publish a release candidate' >&2
            exit 1
          }
          [[ "$TRUSTED_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          trusted="$RUNNER_TEMP/planned-release-trusted"
          mkdir -p "$trusted/.github/scripts" "$trusted/scripts"
          for file in .github/scripts/release_preflight.py scripts/product_version.py; do
            gh api "repos/$REPOSITORY/contents/$file?ref=$TRUSTED_SHA" \
              --jq '.content' | base64 --decode > "$trusted/$file"
          done
          python_command=python3
          if [[ "$RUNNER_OS" == Windows ]]; then python_command=python; fi
          "$python_command" "$trusted/.github/scripts/release_preflight.py" apply \
            --source "$SOURCE_SHA" --workflow "$TRUSTED_SHA" --plan "$PLAN"
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: x86_64-unknown-linux-gnu
      - name: Install bundle validation tools
        run: sudo apt-get update && sudo apt-get install --no-install-recommends --yes binutils jq xvfb xauth xdotool x11-utils x11-apps libxkbcommon-x11-0
      - name: Build the exact Linux target
        run: >-
          cargo build --release --locked --target "$LINUX_BUNDLE_TARGET"
          -p codex_info -p codex-info-recorder -p codex-info-rest
      - name: Create and validate the Linux bundle
        id: bundle
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          output_dir="$RUNNER_TEMP/codex-info-linux-bundle"
          mkdir -p "$output_dir"
          bash scripts/build_linux_bundle.sh \
            --ui-binary "target/$LINUX_BUNDLE_TARGET/release/codex_info" \
            --recorder-binary "target/$LINUX_BUNDLE_TARGET/release/codex_info_recorder" \
            --rest-binary "target/$LINUX_BUNDLE_TARGET/release/codex_info_rest" \
            --output-dir "$output_dir" \
            --source-sha "$SOURCE_SHA" \
            --run-id "$RUN_ID" \
            --run-attempt "$RUN_ATTEMPT"
          bash scripts/test_linux_bundle.sh --bundle-dir "$output_dir"
          archive="$(find "$output_dir" -mindepth 1 -maxdepth 1 -type f -name 'codex-info-*-x86_64-unknown-linux-gnu.tar.gz' -print -quit)"
          candidate_root="$GITHUB_WORKSPACE/.release-candidate-linux"
          mkdir "$candidate_root"
          tar -xzf "$archive" -C "$candidate_root" --no-same-owner
          CODEX_INFO_ACCEPTANCE_BINARY="$candidate_root/codex_info" \
            xvfb-run --auto-servernum --server-args='-screen 0 1280x800x24 -noreset -ac' \
            env -u WAYLAND_DISPLAY -u WAYLAND_SOCKET \
            bash scripts/x11_service_recovery_visual_gate.sh
          rm -r -- "$candidate_root"
          version="$(jq -er '.version | select(type == "string")' "$output_dir"/*.manifest.json)"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          mkdir -p artifacts/linux-bundle
          cp "$output_dir"/*.tar.gz "$output_dir"/*.sha256 "$output_dir"/*.manifest.json artifacts/linux-bundle/
      - name: Upload release candidate
        if: inputs.release_candidate
        uses: actions/upload-artifact@v6
        with:
          name: release-candidate-linux-v1-pr-${{ inputs.pr_number }}-head-${{ inputs.source_sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}-version-${{ steps.bundle.outputs.version }}
          path: artifacts/linux-bundle/*
          if-no-files-found: error
