name: Codacy coverage upload

on:
  workflow_run:
    workflows: ["Feat integration", "Main PR quality"]
    types: [completed]

permissions: {}

jobs:
  upload-complete-coverage:
    name: Upload complete Rust and .NET coverage
    if: >-
      github.event.workflow_run.repository.full_name == github.repository &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.actor.login != 'dependabot[bot]' &&
      github.event.workflow_run.triggering_actor.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out trusted coverage orchestration
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Resolve an exact complete artifact pair
        id: pair
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          WORKFLOW_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          response="$(gh api -H 'Accept: application/vnd.github+json' \
            "repos/$REPOSITORY/actions/runs/$RUN_ID/artifacts?per_page=100")"
          pair="$(python3 scripts/codacy_coverage_artifacts.py \
            --run-id "$RUN_ID" --run-attempt "$RUN_ATTEMPT" <<<"$response")"
          if [[ "$(jq -r '.ready' <<<"$pair")" == false ]]; then
            echo 'ready=false' >>"$GITHUB_OUTPUT"
            echo "::notice::$(jq -r '.reason' <<<"$pair")"
            exit 0
          fi
          source_sha="$(jq -r '.source_sha' <<<"$pair")"
          [[ "$source_sha" == "$WORKFLOW_HEAD_SHA" ]] || {
            echo 'Coverage artifact source does not match the triggering workflow head.' >&2
            exit 1
          }
          rust_name="$(jq -r '.rust_name' <<<"$pair")"
          windows_name="$(jq -r '.windows_name' <<<"$pair")"
          printf 'ready=true\nsource_sha=%s\nrust_name=%s\nwindows_name=%s\n' \
            "$source_sha" "$rust_name" "$windows_name" >>"$GITHUB_OUTPUT"

      - name: Download native coverage
        if: steps.pair.outputs.ready == 'true'
        uses: actions/download-artifact@v5
        with:
          run-id: ${{ github.event.workflow_run.id }}
          name: ${{ steps.pair.outputs.rust_name }}
          path: ${{ runner.temp }}/codacy-coverage/rust
          github-token: ${{ github.token }}

      - name: Download Windows coverage
        if: steps.pair.outputs.ready == 'true'
        uses: actions/download-artifact@v5
        with:
          run-id: ${{ github.event.workflow_run.id }}
          name: ${{ steps.pair.outputs.windows_name }}
          path: ${{ runner.temp }}/codacy-coverage/windows
          github-token: ${{ github.token }}

      - name: Check out the exact tested source without credentials
        if: steps.pair.outputs.ready == 'true'
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.pair.outputs.source_sha }}
          path: source
          persist-credentials: false

      - name: Upload the complete report set to Codacy
        if: steps.pair.outputs.ready == 'true'
        working-directory: source
        env:
          CODACY_API_TOKEN: ${{ secrets.CODACY_API_TOKEN }}
          CODACY_ORGANIZATION_PROVIDER: gh
          CODACY_PROJECT_NAME: codex_info_v2
          CODACY_USERNAME: salty919
          SOURCE_SHA: ${{ steps.pair.outputs.source_sha }}
        run: |
          set -euo pipefail
          [[ -n "$CODACY_API_TOKEN" ]] || {
            echo 'CODACY_API_TOKEN is unavailable; product quality is unaffected.' >&2
            exit 1
          }
          rust_report="$RUNNER_TEMP/codacy-coverage/rust/rust.cobertura.xml"
          mapfile -t windows_reports < <(
            find "$RUNNER_TEMP/codacy-coverage/windows" -type f \
              -name 'windows-*.cobertura.xml' -print | sort
          )
          [[ -s "$rust_report" && ${#windows_reports[@]} -gt 0 ]]
          reports=("$rust_report" "${windows_reports[@]}")
          for report in "${reports[@]}"; do
            [[ -s "$report" ]]
            grep -Eq 'lines-valid="[1-9][0-9]*"' "$report"
            if grep -Eq 'filename="(/|[A-Za-z]:[\\/])' "$report"; then
              echo "Cobertura contains a runner-specific path: $report" >&2
              exit 1
            fi
          done

          reporter="$RUNNER_TEMP/codacy-coverage-reporter-14.1.3"
          curl --proto '=https' --tlsv1.2 -fsSL \
            -o "$reporter" \
            https://github.com/codacy/codacy-coverage-reporter/releases/download/14.1.3/codacy-coverage-reporter-linux
          printf '%s  %s\n' \
            15c5f052207d27b8501ab5d5910c68c206ea70b0157ee1725132780530580875 \
            "$reporter" | sha256sum -c -
          chmod 700 "$reporter"

          args=(report --commit-uuid "$SOURCE_SHA" --force-coverage-parser cobertura)
          for report in "${reports[@]}"; do
            args+=(-r "$report")
          done
          "$reporter" "${args[@]}"
